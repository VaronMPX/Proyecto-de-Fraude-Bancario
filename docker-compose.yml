# Infraestructura local: Kafka + RustFS (S3 compatible) + Neo4j (con Graph Data Science)
# Levantar:  docker compose up -d
services:
  kafka:
    image: apache/kafka:3.7.0          # modo KRaft de un solo nodo, escucha en localhost:9092
    container_name: fraude-kafka
    ports: ["9092:9092"]

  s3:
    image: rustfs/rustfs:1.0.0         # almacenamiento compatible con S3 (reemplaza a MinIO, que retiro sus imagenes)
    container_name: fraude-s3
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]   # 9000 = API S3, 9001 = consola web
    volumes: ["s3_data:/data"]

  neo4j:
    image: neo4j:5.20
    container_name: fraude-neo4j
    environment:
      NEO4J_AUTH: neo4j/fraude1234
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports: ["7474:7474", "7687:7687"]   # 7474 = Neo4j Browser
    volumes:
      - ./salida_spark/export:/var/lib/neo4j/import   # aqui deja Spark cuentas.csv y aristas.csv
      - neo4j_data:/data

volumes:
  s3_data:
  neo4j_data:
